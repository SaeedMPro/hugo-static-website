<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>MCTN site footer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Vazirmatn:wght@100..900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<footer dir="{{dir}}" lang="{{lang}}" style="width: 100%; background: #0f1c26; color: #e6eef3; font-family: Vazirmatn, Tahoma, 'Segoe UI', system-ui, sans-serif;">
<div style="max-width: 1200px; margin: 0 auto; padding: 64px clamp(16px, 4vw, 40px) 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 44px;">
<div style="display: flex; flex-wrap: wrap; gap: 40px 56px;">
<div style="flex: 2 1 300px; display: flex; flex-direction: column; align-items: flex-start; gap: 16px; min-width: 0;">
<a href="{{homeHref}}" aria-label="{{homeLabel}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; color: #e6eef3; text-decoration: none;">
<svg width="40" height="40" viewBox="0 0 34 34" aria-hidden="true" style="flex: none;"><path d="M8 9L17 17L26 9M17 17V27" fill="none" stroke="#7fd0e6" stroke-width="2"></path><circle cx="8" cy="9" r="4" fill="#0f1c26" stroke="#7fd0e6" stroke-width="2"></circle><circle cx="26" cy="9" r="4" fill="#0f1c26" stroke="#7fd0e6" stroke-width="2"></circle><circle cx="17" cy="27" r="4" fill="#0f1c26" stroke="#7fd0e6" stroke-width="2"></circle><circle cx="17" cy="17" r="4.5" fill="#f2b33d"></circle></svg>
<span style="display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-width: 0;">
<span dir="ltr" style="font-size: 24px; line-height: 1.1; font-weight: 800; letter-spacing: 0.06em;">MCTN</span>
<span style="font-size: 13px; line-height: {{lh}}; color: #a3b4c0;">{{descriptor}}</span>
</span>
</a>
<p style="margin: 0; max-width: 420px; font-size: 15px; line-height: {{lhBody}}; color: #a3b4c0; text-wrap: pretty;">{{mission}}</p>
</div>
<sc-for list="{{cols}}" as="col" hint-placeholder-count="2">
<div style="flex: 1 1 150px; display: flex; flex-direction: column; gap: 8px; min-width: 0;">
<h2 style="margin: 0; font-size: 13px; line-height: 1.5; font-weight: 700; color: #7fd0e6; letter-spacing: {{tracking}}; text-transform: {{caps}};">{{col.title}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
<sc-for list="{{col.links}}" as="l" hint-placeholder-count="4">
<li style="display: flex;"><a href="{{l.href}}" style="display: flex; align-items: center; min-height: 44px; color: #e6eef3; font-size: 15px; text-decoration: none;">{{l.label}}</a></li>
</sc-for>
</ul>
</div>
</sc-for>
<div style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 8px; min-width: 0;">
<h2 style="margin: 0; font-size: 13px; line-height: 1.5; font-weight: 700; color: #7fd0e6; letter-spacing: {{tracking}}; text-transform: {{caps}};">{{contactTitle}}</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column;">
<li style="display: flex;"><a href="{{joinHref}}" style="display: flex; align-items: center; min-height: 44px; color: #e6eef3; font-size: 15px; text-decoration: none;">{{joinLabel}}</a></li>
<li style="display: flex;"><a href="{{contactHref}}" style="display: flex; align-items: center; min-height: 44px; color: #e6eef3; font-size: 15px; text-decoration: none;">{{contactLabel}}</a></li>
</ul>
<p style="margin: 4px 0 0; font-size: 14px; line-height: {{lhBody}}; color: #a3b4c0;">{{address}}</p>
<a href="mailto:netlab@example.com" dir="ltr" style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: #7fd0e6; font-size: 15px; font-weight: 600; text-decoration: none; align-self: flex-start;">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3.5 6.5L12 13l8.5-6.5"></path></svg>
<span>netlab@example.com</span>
</a>
</div>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 24px; padding-top: 20px; border-top: 1px solid #253945; font-size: 14px; color: #a3b4c0;">
<span>{{copyright}}</span>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 0 20px;">
<a href="{{newsHref}}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; color: #e6eef3; text-decoration: none;">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="M5 5a14 14 0 0 1 14 14"></path><path d="M5 11a8 8 0 0 1 8 8"></path><circle cx="6" cy="18" r="1.5"></circle></svg>
<span>{{rssLabel}}</span>
</a>
<a href="https://github.com/" style="display: flex; align-items: center; min-height: 44px; color: #e6eef3; text-decoration: none;">GitHub</a>
<a href="{{langHref}}" hreflang="{{otherLang}}" lang="{{otherLang}}" style="display: flex; align-items: center; min-height: 44px; color: #e6eef3; font-weight: 650; text-decoration: none;">{{switchLabel}}</a>
</div>
</div>
</div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fa","en"],"default":"fa"},"page":{"editor":"text","default":"Home"},"$preview":{"width":1440,"height":500}}'>
class Component extends DCLogic {
renderVals() {
const lang = this.props.lang ?? 'fa';
const page = this.props.page ?? 'Home';
const fa = lang === 'fa';
const other = fa ? 'en' : 'fa';
const f = (n) => n + '-' + lang + '.dc.html';
const cols = fa
? [
{ title: 'پژوهش', links: [{ label: 'حوزه‌های پژوهشی', href: f('Research') }, { label: 'پروژه‌ها', href: f('Projects') }, { label: 'انتشارات', href: f('Publications') }] },
{ title: 'گروه', links: [{ label: 'اعضا', href: f('People') }, { label: 'اخبار', href: f('News') }, { label: 'رویدادها', href: f('Events') }, { label: 'آموزش', href: f('Teaching') }, { label: 'منابع', href: f('Resources') }] }
]
: [
{ title: 'Research', links: [{ label: 'Research areas', href: f('Research') }, { label: 'Projects', href: f('Projects') }, { label: 'Publications', href: f('Publications') }] },
{ title: 'Group', links: [{ label: 'People', href: f('People') }, { label: 'News', href: f('News') }, { label: 'Events', href: f('Events') }, { label: 'Teaching', href: f('Teaching') }, { label: 'Resources', href: f('Resources') }] }
];
return {
lang: lang,
dir: fa ? 'rtl' : 'ltr',
otherLang: other,
cols: cols,
homeHref: f('Home'),
joinHref: f('Join'),
contactHref: f('Contact'),
newsHref: f('News'),
langHref: page + '-' + other + '.dc.html',
homeLabel: fa ? 'MCTN، صفحهٔ اصلی' : 'MCTN home',
descriptor: fa ? 'گروه پژوهشی شبکه‌های کامپیوتری · دانشگاه بوعلی سینا' : 'Computer Networks Research Group · Bu-Ali Sina University',
mission: fa ? 'ما روی شبکه‌هایی کار می‌کنیم که خودشان را مدیریت می‌کنند، از خودشان محافظت می‌کنند و انرژی کمتری مصرف می‌کنند.' : 'We study networks that manage themselves, defend themselves and use less energy.',
contactTitle: fa ? 'ارتباط با ما' : 'Get in touch',
joinLabel: fa ? 'پیوستن به گروه' : 'Join us',
contactLabel: fa ? 'تماس' : 'Contact',
address: fa ? 'همدان، دانشگاه بوعلی سینا، دانشکده فنی و مهندسی، گروه مهندسی کامپیوتر' : 'Department of Computer Engineering, Faculty of Engineering, Bu-Ali Sina University, Hamedan, Iran',
copyright: fa ? '© ۱۴۰۵ MCTN · دانشکده فنی و مهندسی، دانشگاه بوعلی سینا' : '© 2026 MCTN · Faculty of Engineering, Bu-Ali Sina University',
rssLabel: fa ? 'خوراک اخبار' : 'News feed',
switchLabel: fa ? 'English' : 'فارسی',
tracking: fa ? '0' : '0.08em',
caps: fa ? 'none' : 'uppercase',
lh: fa ? '1.7' : '1.45',
lhBody: fa ? '1.85' : '1.6'
};
}
}
</script>
</body>
</html>
