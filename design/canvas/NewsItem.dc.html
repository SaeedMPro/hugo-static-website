<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>News item</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Vazirmatn:wght@100..900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<article dir="{{dir}}" lang="{{lang}}" style="font-family: Vazirmatn, Tahoma, 'Segoe UI', system-ui, sans-serif; color: #14212c; padding: 18px 0; border-bottom: 1px solid #d6dfe5; display: flex; flex-direction: column; gap: 4px;">
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.6; color: #5a6a77;">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><rect x="3.5" y="5" width="17" height="15.5" rx="2"></rect><path d="M3.5 10h17"></path><path d="M8 3v4"></path><path d="M16 3v4"></path></svg>
<time datetime="{{iso}}">{{item.date}}</time>
</span>
<h3 style="margin: 0; font-size: 17px; line-height: {{lhTitle}}; font-weight: 700; text-wrap: pretty;"><a href="{{item.href}}" style="color: #14212c; text-decoration: none;">{{item.title}}</a></h3>
<sc-if value="{{showSummary}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; font-size: 15px; line-height: {{lhBody}}; color: #475764; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;">{{item.summary}}</p>
</sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fa","en"],"default":"fa"},"showSummary":{"editor":"boolean","default":true},"item":{"editor":null},"$preview":{"width":640,"height":180}}'>
class Component extends DCLogic {
renderVals() {
const lang = this.props.lang ?? 'fa';
const fa = lang === 'fa';
const item = this.props.item ?? {
date: '۲۳ شهریور ۱۴۰۴',
iso: '2025-09-14',
title: 'دفاع از پایان‌نامهٔ کارشناسی ارشد رضا مقدم',
summary: 'رضا مقدم از پایان‌نامهٔ خود با عنوان «مسیریابی آگاه از انرژی در شبکه‌های حسگر بی‌سیم» دفاع کرد.',
href: 'Article-fa.dc.html'
};
return {
lang: lang,
dir: fa ? 'rtl' : 'ltr',
item: item,
iso: item.iso || '',
showSummary: this.props.showSummary ?? true,
lhTitle: fa ? '1.7' : '1.4',
lhBody: fa ? '1.85' : '1.6'
};
}
}
</script>
</body>
</html>
