<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<title>Project card</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&amp;family=Vazirmatn:wght@100..900&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<article dir="{{dir}}" lang="{{lang}}" style="font-family: Vazirmatn, Tahoma, 'Segoe UI', system-ui, sans-serif; color: #14212c; background: #ffffff; border: 1px solid #d6dfe5; border-radius: 12px; padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; height: 100%;">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.5; font-weight: 650; color: {{statusInk}};"><span style="width: 8px; height: 8px; border-radius: 999px; background: {{statusDot}}; box-shadow: 0 0 0 3px {{statusHalo}};"></span>{{statusLabel}}</span>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{project.areas}}" as="a" hint-placeholder-count="1">
<li style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 999px; background: #e2f0f4; color: #08566c; font-size: 12px; font-weight: 600; line-height: 1;"><span style="width: 6px; height: 6px; border-radius: 999px; background: #0b6e8a;"></span>{{a}}</li>
</sc-for>
</ul>
</div>
<h3 style="margin: 0; font-size: 20px; line-height: {{lhTitle}}; font-weight: 750; text-wrap: pretty;"><a href="{{project.href}}" style="color: #14212c; text-decoration: none;">{{project.title}}</a></h3>
<p style="margin: 0; font-size: 15px; line-height: {{lhBody}}; color: #475764; flex: 1 1 auto; text-wrap: pretty;">{{project.summary}}</p>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-top: 14px; border-top: 1px solid #e6ecf0;">
<div style="display: flex; align-items: center; gap: 10px;">
<div style="display: flex; align-items: center;">
<sc-for list="{{members}}" as="m" hint-placeholder-count="2">
<span title="{{m.name}}" style="width: 32px; height: 32px; border-radius: 999px; background: #e2f0f4; color: #08566c; border: 2px solid #ffffff; box-sizing: content-box; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; line-height: 1; margin-inline-start: {{m.overlap}};">{{m.initials}}</span>
</sc-for>
</div>
<span style="font-size: 13px; color: #5a6a77;">{{membersLabel}}</span>
</div>
<sc-if value="{{hasCode}}" hint-placeholder-val="{{true}}">
<a href="{{project.code}}" style="display: inline-flex; align-items: center; gap: 6px; min-height: 44px; color: #0b6e8a; font-size: 14px; font-weight: 650; text-decoration: none;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.5 8L4.5 12l4 4"></path><path d="M15.5 8l4 4-4 4"></path><path d="M13.5 5.5l-3 13"></path></svg><span>{{codeLabel}}</span></a>
</sc-if>
</div>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["fa","en"],"default":"fa"},"project":{"editor":null},"$preview":{"width":560,"height":340}}'>
class Component extends DCLogic {
renderVals() {
const lang = this.props.lang ?? 'fa';
const fa = lang === 'fa';
const project = this.props.project ?? {
title: 'توازن بار هوشمند در SDN',
summary: 'یک کنترلر SDN که با یادگیری تقویتی جریان‌ها را بین مسیرهای مرکز داده پخش می‌کند.',
status: 'active',
areas: ['شبکه‌های نرم‌افزارمحور', 'مهندسی ترافیک'],
members: [{ initials: 'م ک', name: 'دکتر مریم کاویانی' }, { initials: 'ا ت', name: 'امیر توکلی' }],
href: 'Project-fa.dc.html',
code: 'https://github.com/'
};
const active = project.status === 'active';
const list = project.members || [];
const digits = (n) => fa ? String(n).replace(/[0-9]/g, (d) => '۰۱۲۳۴۵۶۷۸۹'[d]) : String(n);
return {
lang: lang,
dir: fa ? 'rtl' : 'ltr',
project: project,
members: list.map((m, i) => ({ initials: m.initials, name: m.name, overlap: i === 0 ? '0' : '-8px' })),
membersLabel: fa ? digits(list.length) + ' عضو' : list.length + (list.length === 1 ? ' member' : ' members'),
statusLabel: active ? (fa ? 'فعال' : 'Active') : (fa ? 'پایان‌یافته' : 'Completed'),
statusInk: active ? '#8a5a00' : '#5a6a77',
statusDot: active ? '#c98200' : '#8a9aa6',
statusHalo: active ? '#fbf1dc' : '#eaf0f3',
hasCode: !!project.code,
codeLabel: fa ? 'کد' : 'Code',
lhTitle: fa ? '1.6' : '1.3',
lhBody: fa ? '1.85' : '1.6'
};
}
}
</script>
</body>
</html>
