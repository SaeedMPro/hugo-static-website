<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":2600}}'>
class Component extends DCLogic {

const kind = (this.state && this.state.kind) || 'all';
const pill = (key) => {
const on = kind === key;
return {
pressed: on ? 'true' : 'false',
bg: on ? '#0b6e8a' : '#ffffff',
line: on ? '#0b6e8a' : '#b8c6d0',
ink: on ? '#ffffff' : '#14212c',
countInk: on ? '#ffffff' : '#5a6a77',

};
};
const shows = (key) => kind === 'all' || kind === key;
return {
fAll: pill('all'),
fPubs: pill('pubs'),
fPeople: pill('people'),
fNews: pill('news'),
fEvents: pill('events'),
pickAll: () => this.setState({ kind: 'all' }),
pickPubs: () => this.setState({ kind: 'pubs' }),
pickPeople: () => this.setState({ kind: 'people' }),
pickNews: () => this.setState({ kind: 'news' }),

{ name: 'Negar Sadri', initials: 'NS', role: 'PhD student · since 2022', meta: 'Thesis: In-band network telemetry with P4 switches', tags: ['Network telemetry', 'P4'], href: 'Profile-en.dc.html', email: 'n.sadri@example.com', scholar: '' }

]
};
}
}
</script>
