<!doctype html>
<html lang="{{ site.Language.Lang }}" dir="{{ site.Language.LanguageDirection | default "ltr" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Title }}{{ end }}">
  {{ $css := resources.Get "css/main.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
  <link rel="preload" href="{{ "fonts/Vazirmatn-Variable.woff2" | relURL }}" as="font" type="font/woff2" crossorigin>
  {{ range .AllTranslations }}<link rel="alternate" hreflang="{{ .Language.Lang }}" href="{{ .Permalink }}">
  {{ end }}
  <script>document.documentElement.classList.add('js')</script>
</head>
<body>
  <a class="skip" href="#main">{{ i18n "skip" }}</a>
  {{ if site.Params.demo }}<div class="demo-banner">{{ i18n "demoBanner" }}</div>{{ end }}
  {{ partial "header.html" . }}
  <main id="main" class="wrap">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <script>
    (function () {
      var b = document.querySelector('.menu-toggle'), n = document.getElementById('site-nav');
      if (!b || !n) return;
      b.addEventListener('click', function () {
        var open = n.classList.toggle('open');
        b.setAttribute('aria-expanded', open);
      });
    })();
  </script>
</body>
</html>
