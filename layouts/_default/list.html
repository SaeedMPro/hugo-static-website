{{ define "main" }}
<header class="page-head">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</header>
<div class="wrap section section--end">
  {{ with .Content }}<div class="prose">{{ . }}</div>{{ end }}
  {{ with .Pages }}
  <div class="list-card">
    {{ range .ByDate.Reverse }}{{ partial "news-item.html" (dict "page" . "summary" true) }}{{ end }}
  </div>
  {{ end }}
</div>
{{ end }}
