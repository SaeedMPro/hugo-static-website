{{ define "main" }}
<header class="page-head">
  <div class="wrap">
    {{ with .Parent }}{{ if not .IsHome }}{{ partial "crumbs.html" (dict "items" (slice .) "current" $.Title) }}{{ end }}{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Params.lead }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
</header>
<div class="wrap section section--end">
  <div class="prose">{{ .Content }}</div>
</div>
{{ end }}
