{{- /* context: research area page */ -}}
<a class="area-card" href="{{ .RelPermalink }}">
  <span class="icon-tile">{{ partial "icon.html" (dict "name" (.Params.icon | default "sdn") "size" 26) }}</span>
  <h3>{{ .Title }}</h3>
  <p>{{ partial "loc.html" (dict "m" .Params "k" "summary") }}</p>
  <span class="more">{{ i18n "more" }}{{ partial "icon.html" (dict "name" "arrow" "size" 16) }}</span>
</a>
