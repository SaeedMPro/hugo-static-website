{{- /* context: dict "page" person page "size" 32|56|88|120. Photo if set, otherwise initials. */ -}}
{{- $p := .page -}}
{{- $s := .size | default 56 -}}
<span class="avatar avatar--{{ $s }}" aria-hidden="true">
{{- with $p.Params.photo -}}
<img src="{{ partial "pages-url.html" . }}" alt="" width="{{ $s }}" height="{{ $s }}" loading="lazy" decoding="async">
{{- else -}}
{{- partial "initials.html" $p.Title -}}
{{- end -}}
</span>
{{- /**/ -}}
